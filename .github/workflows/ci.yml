---
name: CI
defaults:
  run:
    shell: bash
env:
  golangci_version: v2.15.0
on:
  pull_request: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        id: lookup
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.go
            go.mod
            go.sum
            tests/**
    outputs:
      changes: ${{ steps.lookup.outputs.any_changed }}

  lint:
    runs-on: ubuntu-latest
    needs: lookup
    if: >-
      ${{
        needs.lookup.outputs.changes == 'true' &&
        github.event.pull_request.merged != true &&
        github.event_name != 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Go version from go.mod
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" | tee -a $GITHUB_OUTPUT

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Tidy Go modules
        run: go mod tidy

      - name: Fail if there were changes
        run: |-
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "❌ go.mod or go.sum were modified. Please run 'go mod tidy' and commit the changes."
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.golangci_version }}
          args: --timeout=3m

  test:
    runs-on: ubuntu-latest
    needs: lookup
    if: >-
      ${{
        needs.lookup.outputs.changes == 'true' &&
        github.event.pull_request.merged != true &&
        github.event_name != 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read Go version from go.mod
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Test
        run: |
          go clean -testcache
          go test ./... -coverprofile=coverage.out -timeout 30s -v

      - name: Generate README with coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/{print $3}') ./docs/generate-readme.sh

      - name: Commit README if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            gh api graphql \
            -F githubRepository=${{ github.repository }} \
            -F branchName=${{ github.head_ref }} \
            -F expectedHeadOid=$(git rev-parse HEAD) \
            -F commitMessage="chore: update README.md" \
            -F files[][path]="README.md" -F files[][contents]=$(base64 -w0 README.md) \
            -F 'query=@.github/api/createCommitOnBranch.gql'
          fi

      - name: Lint Markdown
        uses: actionshub/markdownlint@6c82ff529253530dfbf75c37570876c52692835f # v3.1.4
