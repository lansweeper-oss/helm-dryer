---
name: CI
defaults:
  run:
    shell: bash
env:
  golangci_version: "v2.12.2"
on:
  pull_request: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        id: lookup
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files_yaml: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tests/**'
            docs:
              - '**/*.md'
    outputs:
      changes: ${{ steps.lookup.outputs.go_any_changed }}
      docs: ${{ steps.lookup.outputs.docs_any_changed }}

  lint:
    runs-on: ubuntu-latest
    needs: lookup
    if: >-
      ${{
        needs.lookup.outputs.changes == 'true' &&
        github.event.pull_request.merged != true &&
        github.event_name != 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Go version from go.mod
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Tidy Go modules
        run: go mod tidy

      - name: Fail if there were changes
        run: |-
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "❌ go.mod or go.sum were modified. Please run 'go mod tidy' and commit the changes."
            exit 1
          fi
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ env.golangci_version }}
          args: --timeout=3m

  test:
    runs-on: ubuntu-latest
    needs: lookup
    if: >-
      ${{
        needs.lookup.outputs.changes == 'true' &&
        github.event.pull_request.merged != true &&
        github.event_name != 'workflow_dispatch'
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read Go version from go.mod
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Test
        run: |
          go clean -testcache
          go test ./... -coverprofile=coverage.out -timeout 30s -v

      - name: Generate README with coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/{print $3}') ./generate-readme.sh

      - name: Commit README if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            gh api graphql \
            -F githubRepository=${{ github.repository }} \
            -F branchName=${{ github.head_ref }} \
            -F expectedHeadOid=$(git rev-parse HEAD) \
            -F commitMessage="chore: update README.md" \
            -F files[][path]="README.md" -F files[][contents]=$(base64 -w0 README.md) \
            -F 'query=@.github/api/createCommitOnBranch.gql'
          fi

      - name: Lint Markdown
        uses: actionshub/markdownlint@6c82ff529253530dfbf75c37570876c52692835f # v3.1.4
