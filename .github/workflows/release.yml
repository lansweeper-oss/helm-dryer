---
name: Release
defaults:
  run:
    shell: bash
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Get changed files
        id: lookup
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.go
            go.mod
            go.sum
    outputs:
      release: ${{ steps.lookup.outputs.any_changed }}
  release:
    runs-on: ubuntu-latest
    needs: lookup
    if: ${{ needs.lookup.outputs.release == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Go version from go.mod
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" | tee -a $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Get tag
        id: tag-from-input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Bump version and push tag
        id: tag-from-git
        if: ${{ github.event_name != 'workflow_dispatch' || steps.tag-from-input.outputs.tag == '' }}
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: ""

      - name: Get inferred tag
        id: tag
        run: >-
          tag=$(echo "${{
            steps.tag-from-input.outputs.tag != ''
            && steps.tag-from-input.outputs.tag
            || steps.tag-from-git.outputs.new_tag
          }}" | sed 's/^[^v]/v&/') &&
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Build OCI image
        id: build-oci
        if: ${{ steps.tag.outputs.tag != '' }}
        run: >-
          ko build
          --base-import-paths
          --tags ${{ steps.tag.outputs.tag }},latest
          --image-label org.opencontainers.image.authors=Platform@lansweeper.com
          --image-label org.opencontainers.image.source=${{ github.repository }}
          --image-label org.opencontainers.image.url=${{ github.repository }}
          --image-label org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build binaries
        id: build-binaries
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |-
          CMD="github.com/lansweeper-oss/helm-dryer/cmd/dryer"
          NOW=$(date +'%Y-%m-%dT%H:%M:%S')
          ARCHIVES=""
          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "⛏️ Building for $os-$arch..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -ldflags "-s -w -X $CMD.BuildTime=$NOW -X $CMD.BuildVersion=${{ steps.tag.outputs.tag }}" \
                -o /tmp/dryer .
              ARCHIVE="/tmp/dryer-$os-$arch.tar.gz"
              tar -zcf "$ARCHIVE" -C /tmp dryer
              ARCHIVES="${ARCHIVES}${ARCHIVE}"$'\n'
            done
          done
          echo "archives<<EOF" >> $GITHUB_OUTPUT
          echo -n "$ARCHIVES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create a GitHub release
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.tag-from-git.outputs.changelog }}
          files: ${{ steps.build-binaries.outputs.archives }}
